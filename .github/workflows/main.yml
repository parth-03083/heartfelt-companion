name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch name is master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project (with Nitro preset override)
        run: npm run build
        env:
          NITRO_PRESET: github_pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.output/public' # Nitro outputs static sites here

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
